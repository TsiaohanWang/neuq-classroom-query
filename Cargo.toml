[package]
name = "neuq-classroom-query"
version = "3.3.0"
edition = "2024"
description = "东北大学秦皇岛分校空闲教室总表"
authors = ["Tsiaohan Wang"]

[dependencies]
# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls", "gzip", "brotli"] }

# WebVPN（深澜 srun wengine）协议支持：AES-128-CFB 加密资源 URL、AES-128-CBC 加密统一身份认证密码
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cfb-mode = "0.8"
base64 = "0.22"
url = "2"

# 序列化/反序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTML 解析
scraper = "0.21"

# 加密
sha1 = "0.10"
hex = "0.4"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 错误处理
thiserror = "2"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }

# CLI 参数
clap = { version = "4", features = ["derive"] }

# 正则表达式（预编译）
regex = "1"

# 日期时间处理
chrono = { version = "0.4", features = ["serde"] }

# 随机数
rand = "0.8"

# MD5 哈希
md5 = "0.7"

# Cookie 存储
reqwest_cookie_store = "0.8"

# 并行迭代器
rayon = "1"

# 内存分配器（性能优化）
tikv-jemallocator = { version = "0.6", optional = true }

# HTML 压缩
minify-html = "0.15"

# 环境变量文件支持
dotenvy = "0.15"

# TOML 解析
toml = "0.8"

# 模板引擎
tera = "1"

[dev-dependencies]
tempfile = "3"

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.ci]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 256
