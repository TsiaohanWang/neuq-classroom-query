name: Rust Classroom Query and Deploy Automation

on:
#   push:
#     branches: [ main, master ]
#   pull_request:
#     branches: [ main, master ]
#   schedule:
#     - cron: '0 */1 * * *'  # 每 1 小时运行一次
  workflow_dispatch:
    inputs:
      force_overwrite:
        description: 'Force overwrite existing data'
        required: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        
    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Install mold linker
      run: sudo apt-get install -y mold

    - name: Build Rust project
      env:
        RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
      run: cargo build --profile ci

    - name: Run tests
      # 复用 ci profile 产物，避免触发第二次全量编译
      run: cargo test --profile ci

    - name: Fetch Classroom Data
      env:
        YOUR_NEUQ_USERNAME: ${{ secrets.YOUR_NEUQ_USERNAME }}
        YOUR_NEUQ_PASSWORD: ${{ secrets.YOUR_NEUQ_PASSWORD }}
        # 海外 runner 直连教务系统会被 HTTP 483 拒绝，
        # 已配置 WEBVPN secrets 时自动启用 WebVPN 通道
        USE_WEBVPN: ${{ secrets.WEBVPN_USERNAME != '' && 'true' || 'false' }}
        WEBVPN_USERNAME: ${{ secrets.WEBVPN_USERNAME }}
        WEBVPN_PASSWORD: ${{ secrets.WEBVPN_PASSWORD }}
        ASSETS_DIR: ./assets
        OUTPUT_DIR: ./output
        FORCE_OVERWRITE: ${{ inputs.force_overwrite || 'false' }}
      run: ./target/ci/neuq-classroom-query fetch

    - name: Process Data
      env:
        ASSETS_DIR: ./assets
        OUTPUT_DIR: ./output
      run: ./target/ci/neuq-classroom-query process

    - name: Generate HTML
      env:
        ASSETS_DIR: ./assets
        OUTPUT_DIR: ./output
      run: ./target/ci/neuq-classroom-query generate

    - name: Stage files for Pages
      # 只发布站点所需文件，避免把 target/（含编译产物）、.git 等打进 Pages 产物
      run: |
        mkdir -p staging
        cp index.html staging/ 2>/dev/null || true
        cp -r assets staging/assets
        cp CNAME staging/CNAME 2>/dev/null || true
        
    - name: Setup Pages
      uses: actions/configure-pages@v5
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'staging'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
